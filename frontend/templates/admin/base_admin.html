<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} — Canteen Admin</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Admin CSS (not the main site CSS) -->
    <link href="/static/css/admin.css?v=8" rel="stylesheet">
    <!-- Immediate active-section restore to prevent dashboard flash on refresh -->
    <script>
        (function () {
            // Check if admin is logged in this tab session
            if (!sessionStorage.getItem('admin_logged_in')) {
                window.location.replace('/admin/logout');
                return;
            }
            try {
                var hashSec = window.location.hash ? window.location.hash.replace('#', '') : null;
                var storedSec = localStorage.getItem('admin_active_section');
                var activeSec = hashSec || storedSec || 'dashboard-section';
                document.write('<style id="anti-flash-style">.admin-section{display:none !important;}#' + activeSec + '{display:block !important;}</style>');
            } catch (e) { }
        })();
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- ── Sidebar ─────────────────────────────────────── -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="brand-text">Canteen<strong>Admin</strong></span>
        </div>

        <nav class="sidebar-nav">
            <a href="#dashboard-section" class="nav-link active" data-section="dashboard-section">
                Dashboard
            </a>
            <a href="#shops-section" class="nav-link" data-section="shops-section">
                Shops
            </a>
            <a href="#delivery-boys-section" class="nav-link" data-section="delivery-boys-section">
                Delivery Boys
            </a>
            <a href="#foods-section" class="nav-link" data-section="foods-section">
                Foods
            </a>
            <a href="#orders-section" class="nav-link" data-section="orders-section">
                Orders
            </a>
            <a href="#ratings-section" class="nav-link" data-section="ratings-section">
                Ratings
            </a>
            <a href="#settings-section" class="nav-link" data-section="settings-section">
                Fee Settings
            </a>
            <a href="#activity-section" class="nav-link" data-section="activity-section">
                Activity Log
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="http://127.0.0.1:8000" target="_blank" class="back-link">← Back to Main Site</a>
        </div>
    </aside>

    <!-- ── Main Content ────────────────────────────────── -->
    <div class="admin-main">
        <!-- Top Bar -->
        <header class="admin-topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
                <h1 class="topbar-title mb-0">{% block page_title %}Dashboard{% endblock %}</h1>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="/admin/logout" onclick="sessionStorage.removeItem('admin_logged_in')" class="btn btn-sm btn-outline-danger rounded-pill px-3 fw-medium"
                    title="Logout">
                    Logout
                </a>
            </div>
        </header>

        <!-- Content Area -->
        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Admin JS -->
    <script src="/static/js/admin.js?v=18"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
